<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline - FindConstructionBids</title>
  <style>
    :root {
      /* Terracotta primary */
      --color-primary:     oklch(52% 0.16 47);
      --color-primary-deep: oklch(44% 0.15 47);
      /* Warm stone surfaces */
      --color-background:  oklch(97% 0.005 60);
      --color-surface:     oklch(98.5% 0.003 60);
      --color-foreground:  oklch(18% 0.008 60);
      --color-muted:       oklch(52% 0.015 60);
      --color-border:      oklch(87% 0.010 60);
      --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --radius: 0.5rem;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --color-background:  oklch(14% 0.008 60);
        --color-surface:     oklch(17% 0.009 60);
        --color-foreground:  oklch(93% 0.008 60);
        --color-muted:       oklch(64% 0.015 60);
        --color-border:      oklch(25% 0.010 60);
        --color-primary:     oklch(65% 0.16 47);
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--color-background);
      color: var(--color-foreground);
      display: flex;
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-size: 0.9375rem;
      line-height: 1.6;
    }

    .container {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .icon-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background-color: var(--color-border);
      margin: 0 auto 1.5rem;
    }

    .icon {
      width: 32px;
      height: 32px;
      color: var(--color-muted);
    }

    .eyebrow {
      font-size: 0.8125rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--color-foreground);
      margin-bottom: 0.75rem;
    }

    .subtitle {
      color: var(--color-muted);
      margin-bottom: 2rem;
    }

    button {
      background-color: var(--color-primary);
      color: oklch(97% 0.005 60);
      border: none;
      padding: 0.625rem 1.5rem;
      font-size: 0.9375rem;
      font-weight: 500;
      border-radius: 0.375rem;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button:hover {
      background-color: var(--color-primary-deep);
    }

    button:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }

    .cached-pages-section {
      margin-top: 2.5rem;
    }

    .cached-section-label {
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--color-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 0.75rem;
    }

    .cached-pages {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 0.5rem;
      margin-top: 0.75rem;
    }

    .cached-link {
      background-color: var(--color-surface);
      border: 1px solid var(--color-border);
      padding: 0.625rem 0.75rem;
      border-radius: var(--radius);
      color: var(--color-foreground);
      text-decoration: none;
      font-size: 0.875rem;
      transition: border-color 0.15s ease, color 0.15s ease;
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cached-link:hover {
      border-color: var(--color-primary);
      color: var(--color-primary);
    }

    .hidden {
      display: none;
    }

    .footer {
      margin-top: 2.5rem;
      color: var(--color-muted);
      font-size: 0.8125rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-wrap">
      <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a16 16 0 0 1 6.38-2.94"></path>
        <line x1="1" y1="1" x2="23" y2="23"></line>
      </svg>
    </div>

    <p class="eyebrow">No connection</p>
    <h1>You're offline</h1>
    <p class="subtitle">
      Check your internet connection and try again. Some pages may be available from cache.
    </p>

    <button id="reload-btn" type="button">Try again</button>

    <div class="cached-pages-section">
      <p class="cached-section-label">Available offline</p>
      <div id="cached-pages" class="cached-pages hidden">
        <!-- Populated by JS -->
      </div>
      <p id="no-cached-message" class="subtitle" style="font-size:0.875rem">No pages are cached yet.</p>
    </div>

    <div class="footer">
      <p>FindConstructionBids &copy; 2025</p>
    </div>
  </div>

  <script>
    document.getElementById('reload-btn').addEventListener('click', function() {
      window.location.reload();
    });

    if ('caches' in window) {
      caches.open('fcb-pages-cache').then(function(cache) {
        return cache.keys();
      }).then(function(requests) {
        const cachedPagesDiv = document.getElementById('cached-pages');
        const noCachedMessage = document.getElementById('no-cached-message');
        const filtered = requests.filter(function(req) {
          const path = new URL(req.url).pathname;
          return !path.includes('sw.js') && !path.includes('manifest.json') && !path.includes('offline.html');
        });

        if (filtered.length > 0) {
          cachedPagesDiv.classList.remove('hidden');
          noCachedMessage.classList.add('hidden');

          filtered.forEach(function(request) {
            const url = new URL(request.url);
            let path = url.pathname;
            let displayName = 'Home';
            if (path !== '/') {
              displayName = path.substring(1).replace(/\//g, ' / ');
              displayName = displayName.charAt(0).toUpperCase() + displayName.slice(1);
            }
            const link = document.createElement('a');
            link.href = path;
            link.className = 'cached-link';
            link.textContent = displayName;
            link.title = displayName;
            cachedPagesDiv.appendChild(link);
          });
        }
      }).catch(function() {
        // Cache unavailable — show nothing extra
      });
    }
  </script>
</body>
</html>
